name: 代码检查

# 这个 workflow 只跑测试，**不负责部署**。
# 部署是服务器上自己轮询拉代码做的（/opt/deploy/autopull.sh + dsh-forum-autopull.timer），
# 因为这台服务器访问 GitHub 的 git 协议端点是不通的，只能下 tarball。
#
# ⚠️ 服务器上的 autopull 会**等这个 workflow 跑绿了才部署**（CI_GATE=1）。
# 也就是说：这里红了 = 这次提交不会上线，线上仍然跑着上一个好版本。
# 这是故意的 —— 免得一推坏代码网站就挂。急着上线可以先把 CI 修绿；
# 真要先上线再补测试，就去服务器上把 /etc/dsh-forum-autopull.env 里的 CI_GATE 改成 0。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 公开仓库跑 Actions 不花钱，但还是按最小权限来。
permissions:
  contents: read

# 同一个人连着推好几次时，取消掉排队里的旧任务，只跑最新的。
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: 检查（Node ${{ matrix.node }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 是 package.json 里写的最低要求（engines.node >= 22.5.0），也是线上在跑的版本；
        # 24 是当前的 LTS，用它提前发现"以后升级会不会坏"。
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 报一下跑在什么版本上
        run: node -v && npm -v

      # ---------------------------------------------------------------
      # 论坛本体
      # ---------------------------------------------------------------
      - name: 编码检查（中文有没有乱码 / U+FFFD）
        run: node scripts/check-encoding.mjs

      # 骨架自检：五个业务模块能不能被单独拆掉、薄入口有没有变胖、
      # 每张表是不是都有主。它会真的把模块目录临时改名再起一次服务器。
      - name: 骨架自检（模块解耦 + 表归属 + 薄入口行数）
        run: node scripts/check-skeleton.mjs

      # 行为金标准：96 条固定请求的「状态码 + 响应结构」必须与 golden.json 一致。
      # 这是重构/搬家时「用户能感知到的行为一个字都没变」的硬证据。
      - name: 行为金标准（状态码 + 响应结构指纹）
        run: node scripts/check-golden.mjs

      - name: 冒烟测试（起真服务，打一遍接口）
        run: node scripts/smoke.mjs

      - name: AI 接口冒烟（AI_API_KEY 为空，只验状态码与结构）
        run: node scripts/smoke-ai.mjs

      # 动态（v2 的新形态）：可见范围四档、@提醒、配图校验、点赞、引用帖子、编辑与软删除。
      # 这些是新增能力，不在金标准的覆盖范围内，所以单开一套。
      - name: 动态接口冒烟（可见范围 / 配图 / 点赞 / 引用 / 编辑）
        run: node scripts/feed-smoke.mjs

      # 知识库（P2）：文档与积木、版本、可见范围、Wiki 路由。
      - name: 知识库接口冒烟（文档 / 积木 / 版本 / Wiki）
        run: node scripts/doc-smoke.mjs

      # 团队（P4）：七张表、成员与角色（踢人 / 任命）、文件柜（上传 / 下载 / 删除）、
      # 群聊（按 id 增量拉取）、四档可见范围、401 与 403 的区别、版本冲突 409、
      # 加入方式（谁都能加入 / 需要申请）与加入审核、隐藏团队。
      - name: 团队接口冒烟（成员 / 越权 / 版本冲突 / 文件柜 / 群聊 / 加入申请与审核）
        run: node scripts/team-smoke.mjs

      # P3（AI 能力层）的冒烟：能力授权 / 审计 / 回滚 / 成本闸门 / 块类型清单不许漂移。
      # 它自己起一个**本地假模型**（第 18 节还会另起一台「配了 AI_API_KEY」的服务器指向它），
      # 不碰真密钥，可以放心在公开仓库里跑。
      - name: AI 编辑台冒烟（能力授权 / 审计 / 回滚 / 成本闸门）
        run: node scripts/ai-smoke.mjs

      - name: UI 契约检查（前端用到的元素和类名还在不在）
        run: node scripts/check-ui-contract.mjs

      # 前端整页渲染冒烟：用最小 DOM 垫片 + 从真服务器采回来的假数据，
      # 把 public/ 的入口 import 进来、把 38 个页面依次渲染一遍，
      # 再模拟一次「编辑框重画」验证草稿 / 可见范围 / 引用编号没有丢。
      # 它抓的是「搬家把函数体切坏了」「漏了一条 import」「状态没同步」这类只有真执行才炸的问题。
      - name: 前端渲染冒烟（38 个页面 + 编辑框状态）
        run: node scripts/check-frontend.mjs

      # ---------------------------------------------------------------
      # note-studio（笔记）
      # ---------------------------------------------------------------
      - name: 笔记 UI 检查
        run: node scripts/check-notes-ui.mjs

      - name: 笔记接口冒烟
        run: node scripts/notes-smoke.mjs

      - name: note-studio 测试
        run: node note-studio/tests/run.mjs

      # ---------------------------------------------------------------
      # 子包
      # ---------------------------------------------------------------
      # 这个自测自己起一个假的 OpenAI 兼容服务，**不需要真实密钥**，可以放心在公开仓库里跑。
      - name: forum-ai 自检（用假 AI，不碰真密钥）
        run: node forum-ai/selftest.mjs

      - name: note-agent 测试
        run: node note-agent/scripts/run-tests.mjs
